<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoSign - Homepage</title>
  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(18, 22, 33, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-pink: #f72585;
      --text-main: #ffffff;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 3rem;
    }

    /* Navigation */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      margin-bottom: 3rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: -0.5px;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    nav a:hover, nav a.active {
      color: var(--text-main);
    }

    .sign-up-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    .sign-up-btn:hover {
      color: var(--text-main);
    }

    /* Main Section */
    .hero {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
      margin-bottom: 4rem;
    }

    .hero-text h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      font-weight: 700;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 440px;
      margin-bottom: 2rem;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
    }

    .btn-primary {
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00f2fe 0%, #9d4edd 100%);
      color: #000;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
    }

    .btn-secondary {
      padding: 0.85rem 1.8rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Visual Demo Box */
    .visual-card {
      position: relative;
      background: #0f131d;
      border-radius: 16px;
      border: 1px solid rgba(0, 242, 254, 0.2);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15);
    }

    .live-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
    }

    .hand-graphic {
      width: 60%;
      height: auto;
      filter: drop-shadow(0 0 10px var(--accent-cyan));
    }

    .detection-tag {
      position: absolute;
      bottom: 1.5rem;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      color: var(--text-main);
    }

    /* Bottom Features Grid */
    .features-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
    }

    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .feature-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-cyan { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); }
    .icon-purple { background: rgba(157, 77, 221, 0.15); color: var(--accent-purple); }
    .icon-gold { background: rgba(255, 191, 0, 0.15); color: #ffbf00; }
    .icon-pink { background: rgba(247, 37, 133, 0.15); color: var(--accent-pink); }

    .feature-card span {
      font-weight: 600;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">EchoSign</div>
    <nav>
      <a href="#" class="active">Overview</a>
      <a href="#">About</a>
      <a href="#">Template</a>
      <a href="#">Pricing</a>
      <a href="#">Matterns</a>
    </nav>
    <a href="#" class="sign-up-btn">Sign Up</a>
  </header>

  <main class="hero">
    <div class="hero-text">
      <h1>Different Languages.<br>One Conversation.</h1>
      <p>Ther nexivaluados sign are help to help corsonate conversation, Darmmart Data in rmation.</p>
      <div class="cta-group">
        <button class="btn-primary">Get Started</button>
        <button class="btn-secondary">See How It Works</button>
      </div>
    </div>

    <div class="visual-card">
      <div class="live-badge">
        <div class="live-dot"></div> LIVE
      </div>
      
      <!-- Vector graphic simulating the hand tracking wireframe -->
      <svg class="hand-graphic" viewBox="0 0 200 200" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 100 150 L 100 110 M 100 110 L 80 80 M 80 80 L 70 50 M 100 110 L 100 70 M 100 70 L 100 35 M 100 110 L 120 75 M 120 75 L 130 45 M 100 110 L 140 85 M 140 85 L 155 60 M 100 150 L 65 130 M 65 130 L 45 110" />
        <circle cx="100" cy="150" r="4" fill="#00f2fe" />
        <circle cx="100" cy="110" r="4" fill="#00f2fe" />
        <circle cx="80" cy="80" r="4" fill="#00f2fe" />
        <circle cx="70" cy="50" r="4" fill="#00f2fe" />
        <circle cx="100" cy="70" r="4" fill="#00f2fe" />
        <circle cx="100" cy="35" r="4" fill="#00f2fe" />
        <circle cx="120" cy="75" r="4" fill="#00f2fe" />
        <circle cx="130" cy="45" r="4" fill="#00f2fe" />
        <circle cx="140" cy="85" r="4" fill="#00f2fe" />
        <circle cx="155" cy="60" r="4" fill="#00f2fe" />
        <circle cx="65" cy="130" r="4" fill="#00f2fe" />
        <circle cx="45" cy="110" r="4" fill="#00f2fe" />
      </svg>

      <div class="detection-tag">
        HELLO 👋 - Detected Sign
      </div>
    </div>
  </main>

  <footer class="features-grid">
    <div class="feature-card">
      <div class="icon-box icon-cyan">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <span>Eye</span>
    </div>

    <div class="feature-card">
      <div class="icon-box icon-purple">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
      </div>
      <span>Mic</span>
    </div>

    <div class="feature-card">
      <div class="icon-box icon-gold">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3l1.912 5.813a2 2 0 001.272 1.272L21 12l-5.813 1.912a2 2 0 00-1.272 1.272L12 21l-1.912-5.813a2 2 0 00-1.272-1.272L3 12l5.813-1.912a2 2 0 001.272-1.272L12 3z"/></svg>
      </div>
      <span>Sparkles</span>
    </div>

    <div class="feature-card">
      <div class="icon-box icon-pink">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v5M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8 M18 11a2 2 0 0 1 2 2v3a7 7 0 0 1-7 7h-2a7 7 0 0 1-7-7v-3.5"/></svg>
      </div>
      <span>Hands</span>
    </div>
  </footer>

</body>
</html>
